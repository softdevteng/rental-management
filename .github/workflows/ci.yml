name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: rms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    env:
      FORCE_MYSQL: 'true'
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DB: rms
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Wait for MySQL
        run: |
          for i in {1..20}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword >/dev/null 2>&1 && break || sleep 2;
          done

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Run backend migrations (Expense, OccupancyHistory)
        run: |
          cd backend
          # ensure migrations run against MySQL in CI
          FORCE_MYSQL=true npm run migrate
          FORCE_MYSQL=true npm run migrate:occupancy

      - name: Run backend tests
        run: |
          cd backend
          NODE_ENV=test npm test --silent

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: |
          cd frontend
          CI=true npm test -- --watchAll=false
